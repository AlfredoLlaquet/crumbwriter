name: Publish desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read

# A retried release must never race another publisher for the same version.
concurrency:
  group: publish-crumbwriter
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Confirm the requested version belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(python3 packaging/release/assets.py version)
          tag="v$version"
          case "$GITHUB_REF" in
            "refs/tags/$tag"|"refs/heads/release/$tag") ;;
            "refs/heads/$DEFAULT_BRANCH") test "$GITHUB_EVENT_NAME" = workflow_dispatch ;;
            *) echo "::error::The requested ref does not match $tag"; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  unix:
    needs: version
    uses: ./.github/workflows/check.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
  macos:
    needs: version
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [version, unix, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-installer'
          path: incoming
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-runtime-sources*'
          path: incoming
      - name: Collect the tested installers and matching library sources
        run: python3 packaging/release/prepare.py incoming dist
      - name: Sign the installers and checksum list with GitHub's build identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.pkg
            dist/*.tgz
            dist/*.tar.xz
            dist/*-Setup.exe
            dist/*.dmg
            dist/SHA256SUMS
      - name: Verify the records and publish the checked draft
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash packaging/release/publish.sh
