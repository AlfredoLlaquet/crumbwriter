name: Build and test

on:
  push:
    branches-ignore: ['release/v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  openbsd:
    uses: ./.github/workflows/openbsd.yml

  freebsd:
    name: Build and test on FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: '15.1', major: '15' }
          - { release: '14.4', major: '14' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build desktop test fixture
        run: sh tests/build-krohnkite.sh .ci-krohnkite
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: |
            pkg install -y qt6-base qt6-wayland glib pkgconf hunspell en-hunspell en-mythes poppler-utils python3 xorg-vfbserver dejavu
          run: |
            set -eu
            make -j2 crumbwriter tests/qt/test-gui-audit
            python3 packaging/unix/build.py --upgrade-fixture /tmp/crumbwriter-packages
            # Xvfb reports the chosen display only after it can accept clients.
            display_file=$(mktemp)
            Xvfb -screen 0 1280x800x24 -nolisten tcp -displayfd 1 > "$display_file" &
            server=$!
            trap 'kill "$server" 2>/dev/null || true; rm -f "$display_file"' EXIT
            for delay in $(jot 30); do
              [ ! -s "$display_file" ] || break
              kill -0 "$server"
              sleep 1
            done
            test -s "$display_file"
            export DISPLAY=":$(cat "$display_file")" QT_QPA_PLATFORM=xcb
            export LC_ALL=en_US.UTF-8
            suite_status=0
            make check || suite_status=$?
            pkg install -y dbus python3 xterm xdotool xclip xprop xwininfo xauth font-misc-misc
            # Plasma split the X11 window manager into its own package.
            if pkg rquery '%n' plasma6lts-kwin-x11 | grep -qx plasma6lts-kwin-x11; then
              pkg install -y plasma6lts-kwin-x11 plasma6lts-plasma-workspace
            elif pkg rquery '%n' plasma6-kwin-x11 | grep -qx plasma6-kwin-x11; then
              pkg install -y plasma6-kwin-x11 plasma6-plasma-workspace
            else
              pkg install -y plasma6-kwin plasma6-plasma-workspace
            fi
            command -v kwin_x11
            dbus-uuidgen --ensure
            QT_STYLE_OVERRIDE=Breeze timeout 360 dbus-run-session -- sh tests/gui-audit-x11.sh kwin_x11 \
              ./tests/qt/test-gui-audit /tmp/crumbwriter-gui-audit || suite_status=$?
            python3 tests/check-krohnkite.py --existing-display ./crumbwriter .ci-krohnkite
            exit "$suite_status"
      - name: Retrieve FreeBSD screenshots and reports from the VM
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/gui-audit"
          ssh -o BatchMode=yes -o ConnectTimeout=10 freebsd 'tar -C /tmp/crumbwriter-gui-audit -cf - .' \
            | tar -C "$RUNNER_TEMP/gui-audit" -xf -
      - name: Preserve the FreeBSD appearance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-audit-freebsd-${{ matrix.release }}
          path: ${{ runner.temp }}/gui-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Retrieve the native FreeBSD packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          name=$(python3 packaging/release/assets.py freebsd${{ matrix.major }})
          scp "freebsd:/tmp/crumbwriter-packages/$name" "$RUNNER_TEMP/packages/"
          scp freebsd:/tmp/crumbwriter-packages/UpgradeFixture.pkg "$RUNNER_TEMP/packages/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd${{ matrix.major }}-installer
          path: ${{ runner.temp }}/packages/crumbwriter-*-FreeBSD-${{ matrix.major }}-amd64.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd${{ matrix.major }}-upgrade-fixture
          path: ${{ runner.temp }}/packages/UpgradeFixture.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  freebsd-install:
    name: Install, upgrade and remove on clean FreeBSD ${{ matrix.release }}
    needs: freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: '15.1', major: '15' }
          - { release: '14.4', major: '14' }
          - { release: '14.5', major: '14' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd${{ matrix.major }}-installer
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd${{ matrix.major }}-upgrade-fixture
          path: packages
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: pkg install -y xorg-vfbserver dejavu
          run: sh packaging/unix/test-install.sh packages

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versioned download links and release staging
        run: python3 tests/test-release-assets.py
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-wayland libglib2.0-dev libhunspell-dev libarchive-dev poppler-utils hunspell-en-us mythes-en-us dpkg-dev \
            libxcb-cursor0 xvfb xauth weston xdotool dbus-daemon openbox x11-utils
      - name: Build
        id: build
        run: make -j2 crumbwriter tests/qt/test-gui-audit
      - name: Test on X11
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a make check
      - name: Check light and dark windows on native X11
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- \
            sh tests/gui-audit-x11.sh openbox ./tests/qt/test-gui-audit "$RUNNER_TEMP/gui-audit"
      - name: Preserve the Linux appearance evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-audit-linux
          path: ${{ runner.temp }}/gui-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Check the installed icon and type into the native Wayland editor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          install_root="$RUNNER_TEMP/crumbwriter"
          make install PREFIX="$install_root"
          cmp LICENSE "$install_root/share/doc/crumbwriter/LICENSE"
          cmp CrumbWriter.txt "$install_root/share/doc/crumbwriter/CrumbWriter.txt"
          app_id=org.thecrumbs.CrumbWriter
          grep -Fx "Icon=$app_id" "$install_root/share/applications/$app_id.desktop"
          for size in 16 24 32 48 64 128 256; do
            icon="${size}x${size}/apps/$app_id.png"
            cmp "data/icons/$icon" "$install_root/share/icons/hicolor/$icon"
          done
          export PATH="$install_root/bin:$PATH" XDG_DATA_DIRS="$install_root/share:/usr/local/share:/usr/share"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- python3 tests/check-wayland.py "$install_root/bin/crumbwriter"

  deb-package:
    name: Build and install on ${{ matrix.distribution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: 'Ubuntu 24.04', target: ubuntu24.04, image: 'ubuntu:24.04' }
          - { distribution: 'Ubuntu 26.04', target: ubuntu26.04, image: 'ubuntu:26.04' }
          - { distribution: 'Debian 13', target: debian13, image: 'debian:trixie-slim' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build a native distribution package and earlier upgrade fixture
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/source:ro" \
            -v "$RUNNER_TEMP/packages:/packages" "$IMAGE" sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential pkgconf qt6-base-dev \
                libglib2.0-dev libhunspell-dev libarchive-dev poppler-utils dpkg-dev python3
              cp -a /source /build
              cd /build
              make -j2
              python3 packaging/unix/build.py --upgrade-fixture /packages'
      - name: Install, launch, upgrade and remove in a fresh copy of the target distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$RUNNER_TEMP/packages:/packages:ro" \
            -v "$PWD/packaging/unix/test-install.sh:/test-install.sh:ro" "$IMAGE" sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends xvfb fonts-dejavu-core
              sh /test-install.sh /packages'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-installer
          path: ${{ runner.temp }}/packages/crumbwriter_*-${{ matrix.target }}_amd64.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  plasma:
    name: Plasma 6 with Krohnkite
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 20
    steps:
      - name: Install KWin, build tools and virtual display
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential pkgconf npm qt6-base-dev qt6-qpa-plugins libglib2.0-dev \
            libhunspell-dev libarchive-dev poppler-utils hunspell-en-us mythes-en-us libxcb-cursor0 \
            kwin-x11 plasma-workspace dbus-x11 xvfb xauth x11-utils xterm xdotool xclip \
            shared-mime-info xfonts-base fonts-dejavu-core python3 libx11-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Krohnkite 0.9.11.0
        run: sh tests/build-krohnkite.sh /tmp/krohnkite-package
      - name: Check real tiled windows
        run: |
          make -j2
          python3 tests/check-krohnkite.py ./crumbwriter /tmp/krohnkite-package
