name: OpenBSD ports package
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Produce the exact ports distfile
        run: python3 packaging/openbsd/dist.py port-source
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: '8.0'
          usesh: true
          copyback: false
          prepare: |
            set -eu
            PKG_PATH=https://cdn.openbsd.org/pub/OpenBSD/8.0/packages/amd64/ pkg_add cmake-core ninja qt6-qtbase glib2 libarchive hunspell poppler-utils desktop-file-utils gtk4-update-icon-cache xz
            cd /tmp
            ftp -o SHA256.sig https://cdn.openbsd.org/pub/OpenBSD/8.0/SHA256.sig
            ftp -o ports.tar.gz https://cdn.openbsd.org/pub/OpenBSD/8.0/ports.tar.gz
            signify -C -p /etc/signify/openbsd-80-base.pub -x SHA256.sig ports.tar.gz
            tar -xzf ports.tar.gz -C /usr
          run: |
            set -eu
            mkdir -p /usr/ports/mystuff/editors/crumbwriter /usr/ports/distfiles
            cp -R packaging/openbsd/port/. /usr/ports/mystuff/editors/crumbwriter/
            cp port-source/*.tar.xz /usr/ports/distfiles/
            cd /usr/ports/mystuff/editors/crumbwriter
            make package
            cp "$(make show=PKGFILE)" /tmp/
      - name: Retrieve the native package
        run: |
          mkdir -p packages
          scp "openbsd:/tmp/$(python3 packaging/release/assets.py openbsd)" packages/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openbsd-installer
          path: packages/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openbsd-runtime-sources
          path: port-source/*.tar.xz
          if-no-files-found: error

  install:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: openbsd-installer
          path: packages
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: '8.0'
          usesh: true
          copyback: false
          run: |
            set -eu
            cd packages
            env TRUSTED_PKG_PATH="$PWD" PKG_PATH=installpath pkg_add "$PWD"/crumbwriter-*.tgz
            pkg_info -e 'crumbwriter-*'
            crumbwriter --version
            QT_QPA_PLATFORM=offscreen crumbwriter --smoke-test
            pkg_delete crumbwriter
            test ! -e /usr/local/bin/crumbwriter
