name: Windows installer

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, 'appearance/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and package on Windows x64
    outputs:
      installers: ${{ steps.installer_artifact.outcome == 'success' && steps.fixture_artifact.outcome == 'success' }}
      client_audit: ${{ steps.installer_artifact.outcome == 'success' && steps.audit_driver.outcome == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            tar zstd lzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-hunspell
            mingw-w64-ucrt-x86_64-python
      - name: Compile the shared editor and its tests
        id: compile
        shell: msys2 {0}
        run: |
          set -eu
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          cmake --install build --prefix "$(cygpath -m "$PWD/build/stage")"
      - name: Check the installer wizard with the native Inno Setup compiler
        id: wizard
        shell: pwsh
        run: packaging/windows/installer.ps1 -BuildDir build -CheckOnly
      - name: Run the editor tests using Windows Qt
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -eu
          python packaging/shared/stage.py --destination build/test-data
          export QT_QPA_PLATFORM=windows QT_FORCE_STDERR_LOGGING=1 DICPATH="$(cygpath -m "$PWD/build/test-data/dictionaries")"
          export CRUMBWRITER_THESAURUS_DIR="$(cygpath -m "$PWD/build/test-data/thesaurus")"
          ctest --test-dir build --output-on-failure --timeout 180
      - name: Check light and dark windows on the native Windows desktop
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 6
        shell: msys2 {0}
        run: |
          set -eu
          export QT_QPA_PLATFORM=windows QT_FORCE_STDERR_LOGGING=1 DICPATH="$(cygpath -m "$PWD/build/test-data/dictionaries")"
          export CRUMBWRITER_THESAURUS_DIR="$(cygpath -m "$PWD/build/test-data/thesaurus")"
          ./build/test-gui-audit.exe --output build/gui-audit --platform-name windows
      - name: Preserve the Windows appearance evidence
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-audit-windows
          path: build/gui-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the x64 audit driver for the installed Windows 11 check
        id: audit_driver
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gui-audit-driver
          path: build/test-gui-audit.exe
          if-no-files-found: error
          retention-days: 2
      - name: Collect the runtime, dictionary, notices and corresponding source
        id: runtime
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -eu
          prefix=$(cygpath -m "$MINGW_PREFIX")
          python packaging/windows/deploy.py build/stage "$prefix"
          python packaging/shared/stage.py --destination build/stage --msys-root "$prefix" --sources build/runtime-sources
          version=$(python packaging/release/assets.py version)
          tar -C build -cf "build/CrumbWriter-$version-Windows-x64-Sources.tar" runtime-sources
      - name: Build the installer and an earlier-version upgrade fixture
        id: package
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.wizard.outcome == 'success' }}
        shell: pwsh
        run: packaging/windows/installer.ps1 -BuildDir build -WithUpgradeFixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: installer_artifact
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: windows-installer
          path: build/CrumbWriter-*-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: fixture_artifact
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: windows-upgrade-fixture
          path: build/CrumbWriter-UpgradeFixture.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-sources
          path: build/CrumbWriter-*-Windows-x64-Sources.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  install:
    name: Install, upgrade and remove on a clean Windows runner
    runs-on: windows-2025
    needs: build
    # Keep independent installer diagnostics even when a native editor test fails.
    if: ${{ !cancelled() && needs.build.outputs.installers == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-upgrade-fixture
          path: dist
      - name: Exercise the installer and the installed editor
        shell: pwsh
        run: packaging/windows/test-install.ps1 -Setup (Get-Item dist/CrumbWriter-*-Windows-x64-Setup.exe).FullName -Baseline dist/CrumbWriter-UpgradeFixture.exe

  windows11:
    name: Check the installed x64 editor on Windows 11 Arm
    runs-on: windows-11-arm
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.client_audit == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-gui-audit-driver
          path: dist
      - name: Install and capture the editor on the Windows 11 desktop
        shell: pwsh
        run: tests/gui-audit-windows11.ps1 -Setup (Get-Item dist/CrumbWriter-*-Windows-x64-Setup.exe).FullName -Driver dist/test-gui-audit.exe
      - name: Preserve the Windows 11 appearance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-audit-windows-11
          path: ${{ runner.temp }}/gui-audit
          if-no-files-found: warn
          retention-days: 14
