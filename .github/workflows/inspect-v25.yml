name: Inspect released v2.5 controls
on:
  workflow_dispatch:
  push:
    branches: [diagnostics/gui-v2.5]
permissions:
  contents: read
jobs:
  cocoa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the same Qt as the v2.5 Mac bundle
        run: |
          brew install glib hunspell pkgconf ninja
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python" -m pip install 'aqtinstall==3.3.0'
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.8.3 clang_64 --archives qtbase --outputdir "$RUNNER_TEMP/Qt"
      - name: Capture unmodified v2.5 on Cocoa
        run: |
          qt="$RUNNER_TEMP/Qt/6.8.3/macos"
          cmake -S diagnostics/native-v25 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build --target capture-v25 --parallel 3
          QT_QPA_PLATFORM=cocoa QT_PLUGIN_PATH="$qt/plugins" build/capture-v25 cocoa native-appearance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-v25-macOS
          path: native-appearance/
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-hunspell
      - name: Capture unmodified v2.5 on Windows
        shell: msys2 {0}
        run: |
          set -eu
          cmake -S diagnostics/native-v25 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target capture-v25 --parallel 4
          QT_QPA_PLATFORM=windows QT_FORCE_STDERR_LOGGING=1 build/capture-v25.exe windows native-appearance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-v25-Windows
          path: native-appearance/
          if-no-files-found: error
